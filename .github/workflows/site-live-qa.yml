name: Published site smoke test
on:
  workflow_run:
    workflows: ["Deploy personal site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/live-qa.mjs
